# Local dev convenience only — Render doesn't use this file. It spins
# up Postgres and the app together with one command:
#
#   docker compose up --build
#
# -> http://localhost:8080

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: coldstorage
    ports:
      - "5432:5432"
    volumes:
      - coldstorage_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:devpass@postgres:5432/coldstorage?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  coldstorage_pg_data:
